<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profissionais | Clínica Estética</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/nav :: nav}"></header><main class="container"><p class="eyebrow">CADASTROS</p><h1>Profissionais</h1><div class="notice success" role="status" th:if="${success}" th:text="${success}"></div><div class="notice error" role="alert" th:if="${error}" th:text="${error}"></div>
<div class="two-column"><section class="panel"><p class="eyebrow">EQUIPE</p><h2>Profissionais cadastrados</h2><p class="empty-state" th:if="${#lists.isEmpty(professionals)}">Nenhum profissional cadastrado.</p><div class="table-wrap" th:if="${!#lists.isEmpty(professionals)}"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Serviços habilitados</th><th>Ação</th></tr></thead><tbody>
<tr th:each="item : ${professionals}"><td th:text="${item.name}"></td><td th:text="${item.cpf}"></td><td th:text="${item.phone}"></td><td><span th:each="s,iter : ${item.services}" th:text="${s.name + (iter.last ? '' : ', ')}"></span></td><td><a class="text-link" th:href="@{/professionals/{id}/edit(id=${item.id})}">Editar</a></td></tr>
</tbody></table></div></section>
<section class="panel"><p class="eyebrow">FORMULÁRIO</p><h2 th:text="${editId == null ? 'Novo profissional' : 'Editar profissional'}">Novo profissional</h2><form th:object="${professionalForm}" th:action="${editId == null} ? @{/professionals} : @{/professionals/{id}(id=${editId})}" method="post" class="form-stack">
<div class="notice error" role="alert" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
<label for="professional-name">Nome</label><input id="professional-name" th:field="*{name}" required maxlength="120"><small class="field-error" th:errors="*{name}"></small>
<label for="professional-cpf">CPF</label><input id="professional-cpf" th:field="*{cpf}" required inputmode="numeric" placeholder="000.000.000-00"><small class="field-error" th:errors="*{cpf}"></small>
<label for="professional-phone">Telefone</label><input id="professional-phone" th:field="*{phone}" required placeholder="(00) 00000-0000"><small class="field-error" th:errors="*{phone}"></small>
<label for="professional-address">Localização/endereço <span class="muted">(opcional)</span></label><input id="professional-address" th:field="*{address}" maxlength="250">
<label for="professional-services">Serviços que pode realizar</label><select id="professional-services" th:field="*{serviceIds}" multiple size="5"><option th:each="s : ${activeServices}" th:value="${s.id}" th:text="${s.name}"></option></select><small>Use Ctrl (ou Command no Mac) para selecionar mais de um serviço.</small>
<div class="button-row"><button class="button button-primary" type="submit" th:text="${editId == null ? 'Cadastrar profissional' : 'Salvar alterações'}">Salvar</button><a class="button button-quiet" th:if="${editId != null}" th:href="@{/professionals}">Cancelar edição</a></div></form></section></div></main></body></html>

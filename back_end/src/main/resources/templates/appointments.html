<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agendamentos | Clínica Estética</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/nav :: nav}"></header><main class="container"><p class="eyebrow">AGENDA</p><h1>Agendamentos</h1><div class="notice success" role="status" th:if="${success}" th:text="${success}"></div><div class="notice error" role="alert" th:if="${error}" th:text="${error}"></div>
<div class="two-column"><section class="panel"><p class="eyebrow">CONSULTA</p><h2>Agenda</h2><form method="get" th:action="@{/appointments}" class="filter-row"><label for="filter-patient">Paciente</label><select id="filter-patient" name="patientId"><option value="">Todos</option><option th:each="p : ${patients}" th:value="${p.id}" th:selected="${filterPatientId == p.id}" th:text="${p.name}"></option></select><label for="filter-date">Data</label><input id="filter-date" type="date" name="date" th:value="${filterDate}"><button class="button button-secondary" type="submit">Filtrar</button><a class="button button-quiet" th:href="@{/appointments}">Limpar</a></form>
<p class="empty-state" th:if="${#lists.isEmpty(appointments)}">Nenhum agendamento encontrado.</p><div class="table-wrap" th:if="${!#lists.isEmpty(appointments)}"><table><thead><tr><th>Data e hora</th><th>Paciente</th><th>Profissional</th><th>Serviço</th><th>Status</th><th>Ações</th></tr></thead><tbody>
<tr th:each="item : ${appointments}"><td th:text="${#temporals.format(item.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${item.patient.name}"></td><td th:text="${item.professional.name}"></td><td th:text="${item.service.name}"></td><td th:text="${item.status}"></td><td class="actions"><a class="text-link" th:href="@{/appointments/{id}/edit(id=${item.id})}">Editar</a><form th:if="${item.status.name() == 'SCHEDULED'}" th:action="@{/appointments/{id}/status(id=${item.id})}" method="post" onsubmit="return confirm('Marcar este agendamento como concluído?')"><input type="hidden" name="status" value="COMPLETED"><button class="link-button" type="submit">Concluir</button></form><form th:if="${item.status.name() == 'SCHEDULED'}" th:action="@{/appointments/{id}/status(id=${item.id})}" method="post" onsubmit="return confirm('Deseja cancelar este agendamento?')"><input type="hidden" name="status" value="CANCELLED"><button class="link-button danger-text" type="submit">Cancelar</button></form></td></tr>
</tbody></table></div></section>
<section class="panel"><p class="eyebrow">FORMULÁRIO</p><h2 th:text="${editId == null ? 'Novo agendamento' : 'Editar agendamento'}">Novo agendamento</h2><form th:object="${appointmentForm}" th:action="${editId == null} ? @{/appointments} : @{/appointments/{id}(id=${editId})}" method="post" class="form-stack">
<div class="notice error" role="alert" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
<label for="appointment-patient">Paciente</label><select id="appointment-patient" th:field="*{patientId}" required><option value="">Selecione</option><option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option></select><small class="field-error" th:errors="*{patientId}"></small>
<label for="appointment-professional">Profissional</label><select id="appointment-professional" th:field="*{professionalId}" required><option value="">Selecione</option><option th:each="p : ${professionals}" th:value="${p.id}" th:text="${p.name}"></option></select><small class="field-error" th:errors="*{professionalId}"></small>
<label for="appointment-service">Serviço</label><select id="appointment-service" th:field="*{serviceId}" required><option value="">Selecione</option><option th:each="s : ${activeServices}" th:value="${s.id}" th:text="${s.name}"></option></select><small class="field-error" th:errors="*{serviceId}"></small>
<label for="appointment-date">Data e hora</label><input id="appointment-date" type="datetime-local" th:field="*{scheduledAt}" required><small class="field-error" th:errors="*{scheduledAt}"></small>
<label for="appointment-notes">Observações</label><textarea id="appointment-notes" th:field="*{notes}" rows="3" maxlength="1000"></textarea><small class="field-error" th:errors="*{notes}"></small>
<div class="button-row"><button class="button button-primary" type="submit" th:text="${editId == null ? 'Agendar' : 'Salvar alterações'}">Agendar</button><a class="button button-quiet" th:if="${editId != null}" th:href="@{/appointments}">Cancelar edição</a></div></form></section></div></main></body></html>
